<div class="login-container">
  <div class="login-card">
    <img src="assets/logos/skillmuni-login-logo.png" alt="Skillmuni Logo" class="login-logo" />
    <h2 class="login-title">
      Verify your <span class="highlight">Email.</span>
    </h2>
    <p class="login-subtitle">
      Check your inbox for a verification code and enter it below.
    </p>
    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <div class="label-row">
          <label>Verification Code:</label>
        </div>
        <div class="code-input-row">
          <input *ngFor="let digit of code; let i = index"
            #codeInput
            id="code-{{i}}"
            maxlength="1"
            type="tel"
            class="code-input"
            [ngClass]="{'error': errorMessage && !verified}"
            [(ngModel)]="digit.value"
            name="code{{i}}"
            autocomplete="one-time-code"
            (input)="onInput($event, i)"
            (keydown)="onKeyDown($event, i)"
            (paste)="onPaste($event)"
          />
        </div>
      </div>
      <button type="submit" class="login-btn" [disabled]="verifying || codeValue.length < 6">
        <span *ngIf="verifying" class="login-btn-content">
          Verifying <span class="submit-icon">&#10132;</span>
        </span>
        <span *ngIf="!verifying" class="login-btn-content">
          Verify <span class="submit-icon">&#10132;</span>
        </span>
      </button>
      <div *ngIf="errorMessage && !verified" class="error-message">{{ errorMessage }}</div>
      <div *ngIf="successMessage && verified" class="success-message">{{ successMessage }}</div>
    </form>
    <div class="resend-link-container">
      <span *ngIf="countdown > 0" class="resend-link disabled">Resend link in {{ countdown }}s</span>
      <a *ngIf="countdown === 0" href="#" (click)="resendLink(); $event.preventDefault();" class="resend-link">Resend link</a>
    </div>
  </div>
</div>
